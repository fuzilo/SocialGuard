spring.application.name=SocialGuard
server.port=8084
spring.datasource.url=jdbc:mysql://localhost:3306/social_guard?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=aluno
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true

# --- Observabilidade ---
# Endpoints do Actuator (Prometheus coleta /actuator/prometheus)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
# Histograma para calcular percentis (p95/p99) de lat�ncia no Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Traces enviados via OTLP para o Grafana Tempo (docker-compose)
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:aluno}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:aluno}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=5s
app.rabbitmq.batch.exchange=${BATCH_EXCHANGE:socialguard.batch}
app.rabbitmq.batch.queue=${BATCH_QUEUE:socialguard.batch.processing}
app.rabbitmq.batch.routing-key=${BATCH_ROUTING_KEY:batch.process}
app.rabbitmq.batch.dead-letter-exchange=${BATCH_DLX:socialguard.batch.dlx}
app.rabbitmq.batch.dead-letter-queue=${BATCH_DLQ:socialguard.batch.failed}
app.rabbitmq.batch.dead-letter-routing-key=${BATCH_DLX_ROUTING_KEY:batch.failed}
app.rabbitmq.publisher-confirm-timeout=${RABBITMQ_CONFIRM_TIMEOUT:5s}