spring.application.name=SocialGuard
server.port=8084
spring.datasource.url=jdbc:mysql://localhost:3306/social_guard?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=aluno
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true

# --- Observabilidade ---
# Endpoints do Actuator (Prometheus coleta /actuator/prometheus)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
# Histograma para calcular percentis (p95/p99) de latência no Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Traces enviados via OTLP para o Grafana Tempo (docker-compose)
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces